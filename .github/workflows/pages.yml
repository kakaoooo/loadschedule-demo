name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: npm test
      - name: Build demo (fails if export code or secret keys are found)
        run: npm run build:demo
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DEMO_REDIRECT_URL: ${{ vars.DEMO_REDIRECT_URL }}
          DEMO_CONTACT_EMAIL: ${{ vars.DEMO_CONTACT_EMAIL }}
          DEMO_OWNER_NAME: ${{ vars.DEMO_OWNER_NAME }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
