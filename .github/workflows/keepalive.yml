name: Keep Supabase awake
# Supabase แผนฟรีจะพักโปรเจกต์ที่ไม่มีการใช้งานราว 7 วัน — เรียกอ่านตัวอย่างโครงการทุก 3 วันเพื่อให้ยังนับว่ามีการใช้งาน
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query official presets
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY not set - skipping"
            exit 0
          fi
          code=$(curl -sS -o body.json -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/demo_projects?select=id&is_official_preset=eq.true&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not answer 200 (project paused or schema missing?)"
            head -c 300 body.json
            exit 1
          fi
